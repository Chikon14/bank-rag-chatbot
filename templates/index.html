<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тест Банк — Чат</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; background: #f5f5f5; }
        h1 { color: #003580; text-align: center; }
        #chat { background: white; border-radius: 10px; padding: 20px; height: 400px; overflow-y: auto; margin-bottom: 15px; border: 1px solid #ddd; }
        .user-msg { background: #003580; color: white; padding: 10px 15px; border-radius: 15px; margin: 8px 0; max-width: 80%; margin-left: auto; text-align: right; }
        .bot-msg { background: #e8f0fe; padding: 10px 15px; border-radius: 15px; margin: 8px 0; max-width: 80%; }
        #input-area { display: flex; gap: 10px; }
        #question { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #ddd; font-size: 16px; }
        button { background: #003580; color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-size: 16px; }
        button:hover { background: #002060; }
    </style>
</head>
<body>
    <h1>🏦 Тест Банк — Консультант</h1>
    <div id="chat">
        <div class="bot-msg">Здравствуйте! Я консультант Тест Банка. Чем могу помочь?</div>
    </div>
    <div id="input-area">
        <input type="text" id="question" placeholder="Задайте вопрос..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Отправить</button>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById("question");
            const chat = document.getElementById("chat");
            const question = input.value.trim();
            if (!question) return;

            chat.innerHTML += `<div class="user-msg">${question}</div>`;
            input.value = "";

            const response = await fetch("/ask", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({question})
            });
            const data = await response.json();
            chat.innerHTML += `<div class="bot-msg">${data.answer}</div>`;
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
